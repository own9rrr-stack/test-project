<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotary Hub | انتقال هوشمند</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Vazirmatn -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0f2d24 0%, #061a14 100%);
      --accent-yellow: #facc15;
      --accent-lime: #4ade80;
      --dial-base: #0b221a;
      --dial-rotor: rgba(18, 53, 41, 0.78);
      --dial-border: #1e4b3c;
      --text-main: #f0fdf4;
      --text-muted: #86efac;

      /* مقادیر زنده که با انتخاب کاربر توسط جاوااسکریپت تغییر می‌کنند */
      --dial-rotor-live: var(--dial-rotor);
      --dial-border-live: var(--dial-border);
      --live-accent: var(--accent-lime);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: var(--bg-gradient);
      isolation: isolate; /* تضمین می‌کند لایه‌های محیطی زیر محتوا بمانند */
    }

    /* ---------------------------------------------------- */
    /* لایه‌های محیطی: کل فضای پشت صفحه بر اساس انتخاب کاربر تغییر رنگ و نور می‌دهد */
    /* از دو لایه برای کراس‌فید نرم بین تم‌ها استفاده می‌شود */
    /* ---------------------------------------------------- */
    .ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.85s ease;
      background-color: transparent;
    }

    .header-text,
    .dial-container,
    .status-badge {
      position: relative;
      z-index: 5;
    }

    .header-text {
      margin-bottom: 24px;
      text-align: center;
      transition: color 0.6s ease;
    }

    .header-text h1 {
      margin-bottom: 6px;
      color: var(--accent-yellow);
      font-size: 1.6rem;
      font-weight: 800;
    }

    .header-text p {
      color: var(--text-muted);
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .dial-container {
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-base {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background: var(--dial-base);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.05),
        0 0 0 8px var(--dial-border-live);
      transition: box-shadow 0.7s ease;
    }

    .rotary-wheel {
      position: absolute;
      z-index: 5;
      width: 320px;
      height: 320px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: var(--dial-rotor-live);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
      transition: background 0.7s ease, border-color 0.7s ease;
    }

    .rotary-wheel:active {
      cursor: grabbing;
    }

    .dial-center {
      position: absolute;
      z-index: 8;
      width: 130px;
      height: 130px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--accent-yellow);
      border-radius: 50%;
      background: radial-gradient(circle, #163e31 0%, #091c15 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      pointer-events: none;
    }

    .dial-center i {
      margin-bottom: 6px;
      color: var(--accent-yellow);
      font-size: 1.8rem;
    }

    .dial-center span {
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* شاخص توقف فلزی */
    .finger-stop {
      position: absolute;
      z-index: 10;
      bottom: 30px;
      left: 75px;
      width: 28px;
      height: 48px;
      border-radius: 4px;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      clip-path: polygon(0 0, 100% 30%, 80% 100%, 0% 100%);
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .dial-hole {
      position: absolute;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--accent-lime);
      border-radius: 50%;
      background: rgba(6, 26, 20, 0.92);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8), 0 2px 5px rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1.3rem;
      cursor: grab;
      transform: translate(-50%, -50%);
      transition: background 0.25s ease, border-color 0.35s ease, color 0.25s ease;
    }

    .dial-hole:hover {
      border-color: var(--accent-yellow);
      background: rgba(15, 45, 36, 0.95);
    }

    .dial-hole i {
      pointer-events: none;
      transition: color 0.25s ease;
    }

    /* سوراخ نزدیک به شاخص فقط با تغییر رنگ لبه مشخص می‌شود، بدون هیچ هاله نوری */
    .dial-hole.active-target {
      border-color: var(--brand-color, var(--accent-yellow));
    }

    .status-badge {
      margin-top: 24px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid color-mix(in srgb, var(--live-accent) 45%, transparent);
      border-radius: 20px;
      background: color-mix(in srgb, var(--live-accent) 12%, transparent);
      color: var(--live-accent);
      font-size: 0.85rem;
      transition: border-color 0.6s ease, background 0.6s ease, color 0.6s ease;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live-accent);
      box-shadow: 0 0 10px var(--live-accent);
      animation: pulse 1.5s infinite;
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @media (max-width: 420px) {
      .dial-container { transform: scale(0.86); }
      .header-text { margin-bottom: 10px; }
      .status-badge { margin-top: 10px; }
    }
  </style>
</head>

<body>
  <!-- لایه‌های محیطی پشت همه‌چیز -->
  <div class="ambient-layer" id="ambient-a"></div>
  <div class="ambient-layer" id="ambient-b"></div>

  <div class="header-text">
    <h1>هاب ارتباطی مدرن</h1>
    <p>برای اتصال، دکمه مورد نظر را در جهت ساعت‌گرد تا شاخص زرد بچرخانید</p>
  </div>

  <div class="dial-container">
    <div class="dial-base"></div>
    <div class="finger-stop" title="شاخص توقف"></div>

    <div class="dial-center">
      <i class="fa-solid fa-phone-volume"></i>
      <span>انتخاب و شماره‌گیری</span>
    </div>

    <div class="rotary-wheel" id="wheel"></div>
  </div>

  <div class="status-badge">
    <div class="pulse"></div>
    <span id="status-text">آماده برای شماره‌گیری...</span>
  </div>

  <script>
    // هر آیتم علاوه بر رنگ خودش، یک "تم محیطی" کامل دارد که کل پس‌زمینه و گردونه را متحول می‌کند
    const DIAL_ITEMS = [
      {
        id: "tg-support",
        title: "پشتیبانی تلگرام",
        icon: "fa-brands fa-telegram",
        url: "https://t.me/betmizlivesupportbot",
        color: "#29A9EA",
        ambient: `
          radial-gradient(circle at 28% 20%, rgba(41,169,234,0.55), transparent 58%),
          radial-gradient(circle at 78% 78%, rgba(34,158,217,0.32), transparent 55%),
          repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 42px),
          linear-gradient(160deg, #04263b 0%, #071a2b 60%, #030f1c 100%)
        `,
        dialRotor: "rgba(20, 66, 96, 0.78)",
        dialBorder: "#1c5a80"
      },
      {
        id: "instagram",
        title: "اینستاگرام",
        icon: "fa-brands fa-instagram",
        url: "https://instagram.com",
        color: "#E1306C",
        ambient: `
          radial-gradient(circle at 22% 15%, rgba(253,29,161,0.5), transparent 55%),
          radial-gradient(circle at 78% 28%, rgba(245,96,64,0.45), transparent 55%),
          radial-gradient(circle at 50% 88%, rgba(131,58,180,0.5), transparent 60%),
          linear-gradient(135deg, #3a1c53 0%, #521c48 35%, #7c1f4a 65%, #8f2b2b 100%)
        `,
        dialRotor: "rgba(96, 32, 74, 0.78)",
        dialBorder: "#a3306a"
      },
      {
        id: "tg-channel",
        title: "کانال خبری",
        icon: "fa-solid fa-bullhorn",
        url: "https://t.me/BetMiz",
        color: "#1C7ED6",
        ambient: `
          radial-gradient(circle at 30% 25%, rgba(28,126,214,0.5), transparent 55%),
          radial-gradient(circle at 75% 75%, rgba(20,80,150,0.4), transparent 55%),
          repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 46px),
          linear-gradient(160deg, #071a33 0%, #050f22 60%, #020814 100%)
        `,
        dialRotor: "rgba(16, 48, 78, 0.78)",
        dialBorder: "#1d5f92"
      },
      {
        id: "website",
        title: "وب‌سایت رسمی",
        icon: "fa-solid fa-globe",
        url: "https://www.betmiz.com",
        color: "#4ade80",
        ambient: `
          repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 78px),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 78px),
          radial-gradient(circle at 50% 28%, rgba(74,222,128,0.4), transparent 60%),
          linear-gradient(160deg, #0b3d1f 0%, #072b16 55%, #04180d 100%)
        `,
        dialRotor: "rgba(15, 62, 36, 0.78)",
        dialBorder: "#2f7a45"
      },
      {
        id: "app-download",
        title: "دانلود مستقیم اپلیکیشن",
        icon: "fa-solid fa-download",
        url: "https://android.codeideally.com/v2/mp/prod/18756065/app.apk",
        color: "#3DDC84",
        ambient: `
          repeating-linear-gradient(45deg, rgba(61,220,132,0.08) 0px, rgba(61,220,132,0.08) 10px, transparent 10px, transparent 20px),
          radial-gradient(circle at 72% 20%, rgba(61,220,132,0.5), transparent 55%),
          linear-gradient(160deg, #0a3323 0%, #062318 60%, #03120c 100%)
        `,
        dialRotor: "rgba(15, 58, 40, 0.78)",
        dialBorder: "#2fae6f"
      }
    ];

    const wheel = document.getElementById("wheel");
    const statusText = document.getElementById("status-text");
    const root = document.documentElement;
    const ambientA = document.getElementById("ambient-a");
    const ambientB = document.getElementById("ambient-b");

    const WHEEL_SIZE = 320;
    const CENTER = WHEEL_SIZE / 2;
    const RADIUS = 115;

    const STOP_ANGLE = 135;
    const FIRST_HOLE_ANGLE = 85;
    const STEP_ANGLE = 40;
    const MAX_ROTATION = 360;
    const TOLERANCE = 14;
    const AMBIENT_PREVIEW_DIFF = 55; // فاصله‌ای که از آن به بعد پیش‌نمایش تم محیطی شروع می‌شود

    let currentRotation = 0;
    let isDragging = false;
    let hasMoved = false;
    let previousPointerAngle = 0;
    let tappedIndex = null;
    let lastSoundRotation = 0;

    // مدیریت کراس‌فید بین دو لایه محیطی
    let activeLayer = "a";
    let currentThemeId = null;

    function applyAmbient(item) {
      if (!item) {
        if (currentThemeId === null) return;
        ambientA.style.opacity = 0;
        ambientB.style.opacity = 0;
        currentThemeId = null;
        root.style.setProperty("--dial-rotor-live", "var(--dial-rotor)");
        root.style.setProperty("--dial-border-live", "var(--dial-border)");
        root.style.setProperty("--live-accent", "var(--accent-lime)");
        return;
      }

      if (currentThemeId === item.id) return;

      const nextLayer = activeLayer === "a" ? ambientB : ambientA;
      const prevLayer = activeLayer === "a" ? ambientA : ambientB;

      nextLayer.style.background = item.ambient;
      nextLayer.style.opacity = 1;
      prevLayer.style.opacity = 0;

      activeLayer = activeLayer === "a" ? "b" : "a";
      currentThemeId = item.id;

      root.style.setProperty("--dial-rotor-live", item.dialRotor);
      root.style.setProperty("--dial-border-live", item.dialBorder);
      root.style.setProperty("--live-accent", item.color);
    }

    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function setRotation(degrees, smooth = false) {
      wheel.style.transition = smooth
        ? "transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.2)"
        : "none";
      wheel.style.transform = `rotate(${degrees}deg)`;
      currentRotation = degrees;
    }

    function getPointerAngle(event) {
      const rect = wheel.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radians = Math.atan2(event.clientY - centerY, event.clientX - centerX);
      let degrees = radians * (180 / Math.PI);
      if (degrees < 0) degrees += 360;
      return degrees;
    }

    function normalizeAngle(deg) {
      let a = deg % 360;
      if (a < 0) a += 360;
      return a;
    }

    function angleDiff(a, b) {
      const diff = Math.abs(normalizeAngle(a) - normalizeAngle(b));
      return Math.min(diff, 360 - diff);
    }

    function findHoleNearStop(rotation) {
      let bestIndex = null;
      let bestDiff = Infinity;
      DIAL_ITEMS.forEach((_, index) => {
        const holeAngle = FIRST_HOLE_ANGLE - (index * STEP_ANGLE);
        const currentAngle = holeAngle + rotation;
        const diff = angleDiff(currentAngle, STOP_ANGLE);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestIndex = index;
        }
      });
      return { index: bestIndex, diff: bestDiff };
    }

    const holeElements = [];

    function positionOf(index) {
      const angle = FIRST_HOLE_ANGLE - (index * STEP_ANGLE);
      const radians = angle * (Math.PI / 180);
      return {
        x: CENTER + RADIUS * Math.cos(radians),
        y: CENTER + RADIUS * Math.sin(radians)
      };
    }

    function markActiveHole(index) {
      holeElements.forEach((h, i) => {
        h.classList.toggle("active-target", i === index);
      });
    }

    function createDialItems() {
      DIAL_ITEMS.forEach((item, index) => {
        const hole = document.createElement("div");
        hole.className = "dial-hole";
        hole.title = item.title;
        hole.dataset.index = index;
        hole.style.setProperty("--brand-color", item.color);

        const { x, y } = positionOf(index);
        hole.style.left = `${x}px`;
        hole.style.top = `${y}px`;
        hole.innerHTML = `<i class="${item.icon}"></i>`;

        // با هاور روی هر دکمه، کل فضا پیش‌نمایش تم همان مقصد را می‌گیرد (بدون هیچ نور دور دکمه)
        hole.addEventListener("pointerenter", () => {
          if (isDragging) return;
          markActiveHole(index);
          applyAmbient(item);
          statusText.textContent = `آماده اتصال: ${item.title}`;
        });
        hole.addEventListener("pointerleave", () => {
          if (isDragging) return;
          markActiveHole(null);
          applyAmbient(null);
          statusText.textContent = "آماده برای شماره‌گیری...";
        });

        wheel.appendChild(hole);
        holeElements.push(hole);
      });
    }

    wheel.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      isDragging = true;
      hasMoved = false;
      tappedIndex = null;

      const clickedHole = event.target.closest(".dial-hole");
      if (clickedHole) {
        tappedIndex = Number(clickedHole.dataset.index);
      }

      previousPointerAngle = getPointerAngle(event);
      lastSoundRotation = currentRotation;

      wheel.setPointerCapture?.(event.pointerId);
      wheel.style.transition = "none";
    });

    wheel.addEventListener("pointermove", (event) => {
      if (!isDragging) return;

      const currentPointerAngle = getPointerAngle(event);
      let deltaAngle = currentPointerAngle - previousPointerAngle;

      if (deltaAngle > 180) deltaAngle -= 360;
      if (deltaAngle < -180) deltaAngle += 360;

      if (Math.abs(deltaAngle) > 0.4) {
        hasMoved = true;
      }

      let nextRotation = currentRotation + deltaAngle;

      if (nextRotation < 0) nextRotation = 0;
      if (nextRotation > MAX_ROTATION) nextRotation = MAX_ROTATION;

      if (Math.abs(nextRotation - lastSoundRotation) >= 16) {
        playClickSound();
        lastSoundRotation = nextRotation;
      }

      setRotation(nextRotation, false);
      previousPointerAngle = currentPointerAngle;

      const nearest = findHoleNearStop(nextRotation);
      if (nearest.index !== null) {
        const item = DIAL_ITEMS[nearest.index];
        statusText.textContent =
          nearest.diff <= TOLERANCE
            ? `آماده اتصال: ${item.title}`
            : `در حال چرخش به سمت ${item.title}...`;

        if (nearest.diff <= AMBIENT_PREVIEW_DIFF) {
          markActiveHole(nearest.index);
          applyAmbient(item);
        } else {
          markActiveHole(null);
          applyAmbient(null);
        }
      }
    });

    function finishDragging(event) {
      if (!isDragging) return;
      isDragging = false;
      wheel.releasePointerCapture?.(event.pointerId);

      if (!hasMoved && tappedIndex !== null) {
        const index = tappedIndex;
        tappedIndex = null;
        triggerAutoDial(index);
        return;
      }

      const nearest = findHoleNearStop(currentRotation);
      const selectedTarget = nearest.diff <= TOLERANCE ? nearest.index : null;

      setRotation(0, true);

      if (selectedTarget !== null) {
        const item = DIAL_ITEMS[selectedTarget];
        markActiveHole(selectedTarget);
        applyAmbient(item);
        executeRedirect(selectedTarget);
      } else {
        markActiveHole(null);
        applyAmbient(null);
        setTimeout(() => {
          statusText.textContent = "آماده برای شماره‌گیری...";
        }, 300);
      }

      tappedIndex = null;
    }

    wheel.addEventListener("pointerup", finishDragging);
    wheel.addEventListener("pointercancel", finishDragging);

    function triggerAutoDial(index) {
      const item = DIAL_ITEMS[index];
      const holeAngle = FIRST_HOLE_ANGLE - (index * STEP_ANGLE);
      let neededRotation = normalizeAngle(STOP_ANGLE - holeAngle);

      playClickSound();
      markActiveHole(index);
      applyAmbient(item);
      setRotation(neededRotation, true);
      statusText.textContent = `در حال اتصال به ${item.title}...`;

      setTimeout(() => {
        setRotation(0, true);
        executeRedirect(index);
      }, 700);
    }

    function executeRedirect(index) {
      const item = DIAL_ITEMS[index];
      statusText.textContent = `انتقال به ${item.title}`;
      setTimeout(() => {
        window.open(item.url, "_blank", "noopener,noreferrer");
      }, 350);
    }

    createDialItems();
  </script>
</body>
</html>
